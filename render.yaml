services:
  - type: web
    name: linkedin-finder-email-extractor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GOOGLE_WEBHOOK_URL
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: DEFAULT_PATTERN
        value: first.last
